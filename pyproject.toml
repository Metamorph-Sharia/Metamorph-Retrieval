# The retrieval layer's workspace (docs/retrieval-architecture.md in Metamorph-Knowledge-Platform): the contract
# every provider speaks, the providers, and the gateway that composes them for an answering agent.
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
metamorph-retrieval-contract = { workspace = true }
metamorph-retrieval-eval = { workspace = true }
metamorph-market-retrieval = { workspace = true }
metamorph-retrieval-gateway = { workspace = true }
metamorph-regulation-standin = { workspace = true }
# On Linux (the retrieval image), torch's CPU wheels: PyPI's carry CUDA libraries the index never uses (19 GB image).
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "metamorph-retrieval-contract",
    "metamorph-retrieval-eval",
    "metamorph-market-retrieval[embeddings]",
    "metamorph-retrieval-gateway",
    "metamorph-regulation-standin",
    "opentelemetry-sdk>=1.25",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = "--import-mode=importlib"
markers = ["database: needs PostgreSQL (METAMORPH_RETRIEVAL_TEST_DATABASE_URL); skipped otherwise"]
pythonpath = ["packages/metamorph-retrieval-contract/tests", "packages/metamorph-retrieval-eval/tests", "packages/metamorph-market-retrieval/tests", "packages/metamorph-retrieval-gateway/tests", "packages/metamorph-regulation-standin/tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PLE"]

[tool.ruff.lint.isort]
known-first-party = ["metamorph_retrieval_contract", "metamorph_retrieval_eval", "metamorph_market_retrieval", "metamorph_retrieval_gateway", "metamorph_regulation_standin"]
