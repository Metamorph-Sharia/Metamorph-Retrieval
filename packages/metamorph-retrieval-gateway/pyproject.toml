[project]
name = "metamorph-retrieval-gateway"
version = "0.1.0"
description = "The retrieval gateway: composes providers for an answering agent, over MCP and HTTP"
requires-python = ">=3.11"
dependencies = [
    "metamorph-retrieval-contract",
    "httpx>=0.27",
    "mcp>=1.10",
    "opentelemetry-api>=1.25",
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# The reranker's model (adapters/reranker.py), only when METAMORPH_RETRIEVAL_RERANKER names one.
rerank = ["sentence-transformers>=3.0", "torch>=2.4"]

[project.scripts]
metamorph-gateway = "metamorph_retrieval_gateway.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metamorph_retrieval_gateway"]
