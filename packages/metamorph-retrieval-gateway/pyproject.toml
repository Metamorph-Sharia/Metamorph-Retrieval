[project]
name = "metamorph-retrieval-gateway"
version = "0.1.0"
description = "The retrieval gateway: composes providers for an answering agent, over MCP and HTTP"
requires-python = ">=3.11"
dependencies = [
    "metamorph-retrieval-contract",
    "httpx>=0.27",
    "mcp>=1.10",
    "opentelemetry-api>=1.25",
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[project.scripts]
metamorph-gateway = "metamorph_retrieval_gateway.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metamorph_retrieval_gateway"]
