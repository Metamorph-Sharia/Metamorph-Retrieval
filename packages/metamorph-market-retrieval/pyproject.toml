[project]
name = "metamorph-market-retrieval"
version = "0.1.0"
description = "The market provider: companies, statistics, reports and releases from published_market, as evidence"
requires-python = ">=3.11"
dependencies = [
    "metamorph-retrieval-contract",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
# The local embedding model, for building the index and embedding queries. Without it, search is full text only.
embeddings = ["sentence-transformers>=3.0", "torch>=2.4"]  # torch named, so the workspace can pick its wheels

[project.scripts]
metamorph-market-index = "metamorph_market_retrieval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metamorph_market_retrieval"]
