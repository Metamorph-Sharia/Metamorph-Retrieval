[project]
name = "metamorph-regulation-standin"
version = "0.1.0"
description = "Stands in for the regulatory provider until it arrives: read and describe over published, never search"
requires-python = ">=3.11"
dependencies = [
    "metamorph-retrieval-contract",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metamorph_regulation_standin"]
