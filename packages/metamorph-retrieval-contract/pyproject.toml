[project]
name = "metamorph-retrieval-contract"
version = "0.1.0"
description = "Retrieval contract 0.1: refs, evidence, the provider protocol, JSON Schemas and a conformance check"
readme = "RETRIEVAL_CONTRACT.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23",
    "rfc3339-validator>=0.1.4",  # makes the schema's "date-time" format binding
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metamorph_retrieval_contract"]
