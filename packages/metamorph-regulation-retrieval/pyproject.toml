[project]
name = "metamorph-regulation-retrieval"
version = "0.1.0"
description = "The regulatory provider: regulations and fatwas, clause by clause, for the retrieval gateway"
requires-python = ">=3.11"
dependencies = [
    "metamorph-retrieval-contract",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
]

[project.optional-dependencies]
# The embedding model, for building the index. Without it, the builder refuses rather than writes a half index.
embeddings = ["sentence-transformers>=3.0", "torch>=2.4"]  # torch named, so the workspace can pick its wheels

[project.scripts]
metamorph-regulation-index = "metamorph_regulation_retrieval.indexing.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metamorph_regulation_retrieval"]
