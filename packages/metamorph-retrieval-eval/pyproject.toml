[project]
name = "metamorph-retrieval-eval"
version = "0.1.0"
description = "Evaluation of retrieval providers: question sets with expected evidence, a runner and its report"
requires-python = ">=3.11"
dependencies = [
    "metamorph-retrieval-contract",
]

[project.scripts]
metamorph-eval = "metamorph_retrieval_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metamorph_retrieval_eval"]
